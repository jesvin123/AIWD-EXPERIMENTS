<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
            font-size: 0.95em;
        }

        .event-count {
            color: #666;
            font-size: 0.85em;
            margin-top: 8px;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .btn-admin {
            background: #17a2b8;
            color: white;
            margin-top: 15px;
            display: block;
            width: 100%;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
        }

        .btn-admin:hover {
            background: #138496;
            transform: translateY(-2px);
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert.show {
            display: block;
        }

        .success-details {
            margin-top: 15px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #28a745;
            display: none;
        }

        .success-details.show {
            display: block;
        }

        .detail-item {
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .detail-value {
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Event Registration</h1>
            <p>Register for your favorite events</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="regno">Register Number <span style="color: red;">*</span></label>
                <input type="text" id="regno" name="regno" placeholder="e.g., 23CS101" required>
            </div>

            <div class="form-group">
                <label for="name">Name <span style="color: red;">*</span></label>
                <input type="text" id="name" name="name" placeholder="e.g., Arun Kumar" required>
            </div>

            <div class="form-group">
                <label>Select Events <span style="color: red;">*</span> (Maximum 3)</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="event1" name="events" value="Coding Challenge">
                        <label for="event1">Coding Challenge</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="event2" name="events" value="Debugging Contest">
                        <label for="event2">Debugging Contest</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="event3" name="events" value="Web Design">
                        <label for="event3">Web Design</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="event4" name="events" value="Quiz Competition">
                        <label for="event4">Quiz Competition</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="event5" name="events" value="Paper Presentation">
                        <label for="event5">Paper Presentation</label>
                    </div>
                </div>
                <div class="event-count">
                    Selected events: <span id="eventCount">0</span>/3
                </div>
            </div>

            <div class="success-details" id="successDetails">
                <div class="detail-item">
                    <span class="detail-label">Register Number:</span>
                    <span class="detail-value" id="successRegno"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Name:</span>
                    <span class="detail-value" id="successName"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Events:</span>
                    <span class="detail-value" id="successEvents"></span>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Register</button>
                <button type="reset" class="btn-reset">Clear</button>
            </div>
        </form>

        <a href="/admin" class="btn-admin">Go to Admin Search</a>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const alertMessage = document.getElementById('alertMessage');
        const eventCheckboxes = document.querySelectorAll('input[name="events"]');
        const eventCount = document.getElementById('eventCount');
        const successDetails = document.getElementById('successDetails');

        // Update event count when checkboxes are clicked
        eventCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', updateEventCount);
        });

        function updateEventCount() {
            const checkedCount = document.querySelectorAll('input[name="events"]:checked').length;
            eventCount.textContent = checkedCount;

            // Disable checkboxes if 3 events are already selected
            eventCheckboxes.forEach(checkbox => {
                checkbox.disabled = checkedCount === 3 && !checkbox.checked;
            });
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const regno = document.getElementById('regno').value.trim();
            const name = document.getElementById('name').value.trim();
            const selectedEvents = Array.from(
                document.querySelectorAll('input[name="events"]:checked')
            ).map(checkbox => checkbox.value);

            // Client-side validation
            if (!regno) {
                showAlert('Register Number is required', 'danger');
                return;
            }

            if (!name) {
                showAlert('Name is required', 'danger');
                return;
            }

            if (selectedEvents.length === 0) {
                showAlert('Please select at least one event', 'danger');
                return;
            }

            if (selectedEvents.length > 3) {
                showAlert('You can select a maximum of 3 events', 'danger');
                return;
            }

            // Submit to server
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        regno,
                        name,
                        events: selectedEvents
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, 'success');
                    displaySuccessDetails(data.data);
                    form.reset();
                    updateEventCount();
                } else {
                    showAlert(data.message, 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('An error occurred. Please try again.', 'danger');
            }
        });

        function showAlert(message, type) {
            alertMessage.textContent = message;
            alertMessage.className = `alert alert-${type} show`;
            successDetails.classList.remove('show');

            if (type !== 'success') {
                // Hide alert after 5 seconds
                setTimeout(() => {
                    alertMessage.classList.remove('show');
                }, 5000);
            }
        }

        function displaySuccessDetails(data) {
            document.getElementById('successRegno').textContent = data.regno;
            document.getElementById('successName').textContent = data.name;
            document.getElementById('successEvents').textContent = data.events.join(', ');
            successDetails.classList.add('show');
        }
    </script>
</body>
</html>
