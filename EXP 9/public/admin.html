<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Search - Event Registration System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            background: #f0f0f0;
            color: #333;
            width: 100%;
            margin-top: 15px;
        }

        .btn-back:hover {
            background: #e0e0e0;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert.show {
            display: block;
        }

        .result-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #28a745;
            display: none;
            margin-bottom: 20px;
        }

        .result-box.show {
            display: block;
        }

        .result-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .result-value {
            color: #666;
            font-size: 1em;
            word-wrap: break-word;
        }

        .btn-new-search {
            background: #17a2b8;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-new-search:hover {
            background: #138496;
        }

        .stats {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #b3d9ff;
        }

        .stats-text {
            color: #004085;
            font-size: 0.95em;
        }

        .stats-count {
            font-size: 1.5em;
            font-weight: bold;
            color: #0056b3;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .search-box {
                flex-direction: column;
            }

            .btn-search {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Search</h1>
            <p>Search registrations by register number</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <div class="form-group">
            <label for="searchRegno">Register Number</label>
            <div class="search-box">
                <input type="text" id="searchRegno" placeholder="e.g., 23CS101" name="searchRegno">
                <button class="btn-search" onclick="searchRegistration()">Search</button>
            </div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span class="result-label">Register Number:</span>
                <span class="result-value" id="resultRegno"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Name:</span>
                <span class="result-value" id="resultName"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Events:</span>
                <span class="result-value" id="resultEvents"></span>
            </div>
            <button class="btn-new-search" onclick="clearSearch()">New Search</button>
        </div>

        <div class="stats">
            <div class="stats-text">Total Registrations in Database</div>
            <div class="stats-count" id="statsCount">-</div>
        </div>

        <button class="btn-back" onclick="goHome()">Back to Registration</button>
    </div>

    <script>
        const alertMessage = document.getElementById('alertMessage');
        const resultBox = document.getElementById('resultBox');
        const searchInput = document.getElementById('searchRegno');

        // Load stats on page load
        window.addEventListener('load', loadStats);

        // Allow Enter key to search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchRegistration();
            }
        });

        async function searchRegistration() {
            const regno = searchInput.value.trim();

            if (!regno) {
                showAlert('Please enter a Register Number', 'danger');
                resultBox.classList.remove('show');
                return;
            }

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ regno })
                });

                const data = await response.json();

                if (response.ok) {
                    displayResult(data.data);
                    showAlert(data.message, 'success');
                } else {
                    showAlert(data.message, 'danger');
                    resultBox.classList.remove('show');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('An error occurred. Please try again.', 'danger');
                resultBox.classList.remove('show');
            }
        }

        function displayResult(data) {
            document.getElementById('resultRegno').textContent = data.regno;
            document.getElementById('resultName').textContent = data.name;
            document.getElementById('resultEvents').textContent = data.events.join(', ');
            resultBox.classList.add('show');
        }

        function showAlert(message, type) {
            alertMessage.textContent = message;
            alertMessage.className = `alert alert-${type} show`;

            if (type !== 'success') {
                setTimeout(() => {
                    alertMessage.classList.remove('show');
                }, 5000);
            }
        }

        function clearSearch() {
            searchInput.value = '';
            resultBox.classList.remove('show');
            alertMessage.classList.remove('show');
            searchInput.focus();
        }

        function goHome() {
            window.location.href = '/';
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/registrations');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('statsCount').textContent = data.count;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
    </script>
</body>
</html>
